replicaCount: 2

image:
  repository: ghcr.io/toddward/resume
  tag: latest
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-credentials

namespace: wardzinskiresume

service:
  type: ClusterIP
  port: 80
  targetPort: 80

ingress:
  enabled: false
  className: nginx
  hosts:
    - wardzinski.info
    - www.wardzinski.info

resources:
  requests:
    cpu: 20m
    memory: 55M

livenessProbe:
  httpGet:
    path: /index.html
    port: 80
  initialDelaySeconds: 15
  timeoutSeconds: 25

readinessProbe:
  httpGet:
    path: /index.html
    port: 80
  initialDelaySeconds: 15
  timeoutSeconds: 25

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 1
